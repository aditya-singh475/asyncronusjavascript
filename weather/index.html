<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Weather App</h1>

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">
                Search
            </button>

        </div>

        <div id="loading">
            Loading...
        </div>

        <div id="error"></div>

        <div class="weather-card">

            <h2 id="cityName">--</h2>

            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>

            <p id="weatherDescription">
                --
            </p>

            <div class="weather-details">

                <div>
                    <h3>Feels Like</h3>
                    <p id="feelsLike">--°C</p>
                </div>

                <div>
                    <h3>Humidity</h3>
                    <p id="humidity">--%</p>
                </div>

                <div>
                    <h3>Wind</h3>
                    <p id="wind">-- km/h</p>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
